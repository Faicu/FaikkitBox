# Restrângerea privilegiilor serviciului. Pasul 1: procesul rămâne root, dar cu
# o suprafață mai mică. Vezi comentariile — mai multe opțiuni evidente NU pot fi
# activate cât timp pagina Tehnic poate rula apt/sudo.
[Service]
# NoNewPrivileges NU poate fi activat: comenzile din pagina Tehnic folosesc
# sudo, iar sudo e setuid — ar eșua toate cu "must be setuid root".
NoNewPrivileges=no

# La fel, ProtectSystem/ProtectHome rămân dezactivate cât timp aplicația poate
# rula `apt-get upgrade` (scrie în /usr și /var) și docker-compose pe fișierele
# din /root/plex și /root/immich-app. Se pot activa doar dacă acele comenzi ies
# din aplicație.

PrivateTmp=yes
ProtectHostname=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectKernelLogs=yes
RestrictRealtime=yes
LockPersonality=yes
# Nimic din aplicație nu deschide alt tip de socket; netlink e necesar pentru
# citirea interfețelor de rețea.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
