# Trecerea serviciului de pe root pe contul dedicat `faikkitbox`.
#
# Se instalează în /etc/systemd/system/faikkitbox.service.d/service-user.conf,
# lângă hardening.conf (care rămâne). Presupune contul, home-ul și drepturile
# create de apply.sh (scos după aplicare, e în istoricul git).
[Service]
User=faikkitbox
Group=media
# Nodul, git și npm caută configurările în HOME; fără asta ar încerca /root.
Environment=HOME=/var/lib/faikkitbox
